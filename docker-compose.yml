version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: simrs-postgres
    env_file:
      - ./backend/.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dimas_simrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dimas_simrs_123}
      POSTGRES_DB: ${POSTGRES_DB:-simrs}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimas_simrs -d simrs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simrs-network

  # Backend API (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simrs-backend
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_DSN: "host=postgres user=${POSTGRES_USER:-dimas_simrs} password=${POSTGRES_PASSWORD:-dimas_simrs_123} dbname=${POSTGRES_DB:-simrs} port=5432 sslmode=disable"
      APP_ENV: "production"
    ports:
      - "8899:8080"
    volumes:
      - backend_uploads:/root/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simrs-network
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://147.93.104.139:8899/api
    container_name: simrs-frontend
    ports:
      - "3232:80"
    depends_on:
      - backend
    networks:
      - simrs-network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:

networks:
  simrs-network:
    driver: bridge
